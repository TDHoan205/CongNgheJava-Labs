<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Lab 15</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);">

    <div class="card" style="max-width: 450px; width: 100%; padding: 2.5rem; border: 1px solid #334155; box-shadow: 0 20px 35px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #10b981, #6366f1); border-radius: 12px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                🔐
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #fff;">Đăng nhập Hệ thống</h1>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.35rem;">Lab 15 - Phân quyền Spring Security (ADMIN / USER)</p>
        </div>

        <!-- Error / Logout Alert -->
        <div th:if="${param.error}" class="alert alert-danger" style="font-size: 0.9rem;">
            ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác!
        </div>
        <div th:if="${param.logout}" class="alert alert-success" style="font-size: 0.9rem;">
            ✅ Bạn đã đăng xuất thành công khỏi hệ thống!
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Tên đăng nhập (Username):</label>
                <input type="text" name="username" class="form-control" placeholder="admin hoặc user" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu (Password):</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 1rem; font-size: 1rem;">
                🚀 Đăng nhập
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid #334155; font-size: 0.85rem; color: #94a3b8;">
            <strong style="color: #cbd5e1; display: block; margin-bottom: 0.5rem;">Tài khoản kiểm thử demo:</strong>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span>👑 <strong>ADMIN:</strong> admin / admin123</span>
                <span class="badge badge-admin">Toàn quyền CRUD</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span>👤 <strong>USER:</strong> user / user123</span>
                <span class="badge badge-user">Xem & Đăng ký</span>
            </div>
        </div>
    </div>

</body>
</html>
