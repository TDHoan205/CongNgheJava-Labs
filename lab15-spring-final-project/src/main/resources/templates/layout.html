<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} != null ? ${title} : 'Lab 15 - Spring Framework Project'">Lab 15 Spring Framework</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header Navigation -->
    <header th:fragment="header(activeTab)">
        <div class="nav-container">
            <a th:href="@{/dashboard}" class="brand">
                <div class="brand-icon">⚡</div>
                <span>EAUT Spring Portal</span>
            </a>
            <ul class="nav-menu">
                <li>
                    <a th:href="@{/dashboard}" th:class="${activeTab == 'dashboard'} ? 'nav-link active' : 'nav-link'">📊 Dashboard</a>
                </li>
                <li>
                    <a th:href="@{/students}" th:class="${activeTab == 'students'} ? 'nav-link active' : 'nav-link'">👨‍🎓 Sinh viên</a>
                </li>
                <li>
                    <a th:href="@{/courses}" th:class="${activeTab == 'courses'} ? 'nav-link active' : 'nav-link'">📚 Môn học</a>
                </li>
                <li>
                    <a th:href="@{/enrollments}" th:class="${activeTab == 'enrollments'} ? 'nav-link active' : 'nav-link'">📝 Đăng ký học phần</a>
                </li>
                
                <!-- Authentication Status -->
                <li sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 0.5rem; margin-left: 0.5rem;">
                    <span class="user-badge">
                        👤 <strong sec:authentication="name">User</strong>
                        <span sec:authorize="hasRole('ADMIN')" class="badge badge-admin">ADMIN</span>
                        <span sec:authorize="!hasRole('ADMIN')" class="badge badge-user">USER</span>
                    </span>
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-secondary btn-sm" style="padding: 0.35rem 0.65rem;">🚪 Đăng xuất</button>
                    </form>
                </li>
                <li sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-primary btn-sm">🔑 Đăng nhập</a>
                </li>
            </ul>
        </div>
    </header>

    <!-- Footer Fragment -->
    <footer th:fragment="footer">
        <p>&copy; 2026 Học phần Công nghệ Java (IT3242) - Lab 15: Dự án Tổng hợp với Spring Framework & MySQL</p>
        <p style="margin-top: 0.3rem;">Sinh viên thực hiện: <strong>Trần Đức Hoàn</strong> - MSSV: <strong>2030022</strong> - Lớp <strong>DCCNTT14.10.1</strong></p>
    </footer>

</body>
</html>
