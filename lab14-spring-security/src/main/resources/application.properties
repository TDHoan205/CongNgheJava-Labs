# Server Port Configuration
server.port=8080
spring.application.name=lab13-spring-data-jpa

# =========================================================
# H2 Database Configuration (Default for Lab 13 Bài 1-5)
# =========================================================
spring.datasource.url=jdbc:h2:mem:eautdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# MySQL Database Configuration (Optional for Lab 13 Bài 10)
# Un-comment below lines when switching to MySQL
# =========================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/lab13_jpa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=123456

# =========================================================
# JPA & Hibernate Configuration
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf & Servlet Encoding Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
