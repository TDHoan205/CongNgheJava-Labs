spring.application.name=management-portal-spring
server.port=8082

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/java_integrated_lab?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.vn.edu.eaut=INFO
